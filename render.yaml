services:
  - type: pserv
    name: sentinel-ai
    runtime: python
    rootDir: ai
    buildCommand: pip install -r requirements.txt
    startCommand: python glow_server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11

  - type: web
    name: sentinel-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    plan: starter
    disk:
      name: sentinel-data
      mountPath: /opt/render/project/src/backend/storage
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /opt/render/project/src/backend/storage/sentinel.db
      - key: UPLOADS_DIR
        value: /opt/render/project/src/backend/storage/uploads
      - key: AI_SERVICE_URL
        value: http://sentinel-ai:10000
      - key: GEMINI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: FARMER_PHONE_NUMBER
        sync: false

  - type: web
    name: sentinel-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        value: https://sentinel-api.onrender.com
